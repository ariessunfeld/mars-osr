[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-osr"
version = "0.1.0"
description = "Mars orbital solar-reflector simulation and trajectory-design tools"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ari Essunfeld" }]
keywords = ["Mars", "solar sail", "orbital reflector", "astrodynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "numba==0.66.0",
    "scipy",
    "spiceypy",
    "requests",
    "cloudpickle",
]

[project.optional-dependencies]
optimization = ["cyipopt"]
examples = ["matplotlib"]
figures = ["matplotlib", "netCDF4", "pandas", "Pillow", "pyvista"]
test = ["Pillow", "pytest"]
dev = ["build", "matplotlib", "netCDF4", "pandas", "Pillow", "pytest", "pyvista"]

[project.urls]
Repository = "https://github.com/ariessunfeld/mars-osr"
Issues = "https://github.com/ariessunfeld/mars-osr/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: tests whose individual runtime is >= 30 seconds; excluded from the fast loop",
]
