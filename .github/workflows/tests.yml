name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MARS_OSR_DATA_DIR: ${{ github.workspace }}/data

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Restore downloaded scientific data
        uses: actions/cache@v5
        with:
          path: |
            data/spice
            data/gravity
          key: scientific-data-${{ runner.os }}-${{ hashFiles('src/reflectors/kernels.py', 'src/reflectors/gravity.py') }}
      - name: Fetch required NAIF kernels
        run: python scripts/fetch_kernels.py
      - name: Run fast test suite
        run: pytest
